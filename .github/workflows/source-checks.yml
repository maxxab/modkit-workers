name: Dependency-independent source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-independent:
    name: Dependency-independent checks (not full qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install only source-check tooling
        run: python -m pip install -r .github/requirements-source-ci.txt
      - name: Verify Events is absent from this limited check
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('modkit_events') is None"
      - name: Lint all source and tests
        run: python -m ruff check --no-cache src tests
      - name: Check formatting of all source and tests
        run: python -m ruff format --check --no-cache src tests
      - name: Run dependency-independent tests only
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_package_exports.py \
            tests/test_migration_resources.py \
            tests/test_handler_partials.py
      - name: Check source-distribution privacy only
        run: python tests/check_sdist_contents.py
      - name: Record qualification limits
        if: ${{ always() }}
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Dependency-independent source checks only

          This job covers Ruff lint and formatting over src/tests, the three explicitly
          selected source test files, and the source-distribution privacy regression.
          See individual step outcomes.

          **Full suite: BLOCKED** until compatible public Events contracts and
          persistence APIs are available. The inspected public Events 0.1.0 source
          lacks those modules and does not satisfy modkit-events>=0.2,<0.3.
          No Events checkout, dependency downgrade, or skipped-test fallback is used.

          **NOT_READY for production or package release.** A green job does not
          qualify the complete suite, dependency resolution, installed wheel/sdist,
          type checking, the planned interpreter/OS matrix, native
          drivers, production SQL resources, PostgreSQL/Redis, or a worker runtime.
          SUMMARY
