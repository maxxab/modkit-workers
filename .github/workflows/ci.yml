name: Package CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: maxxab/modkit-events
          ref: 9362f0d318c762283f70b18c4f2907f1fda39f8b
          path: .ci-standards
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate commits and changelog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git -C .ci-standards rev-parse HEAD)" = 9362f0d318c762283f70b18c4f2907f1fda39f8b
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "$PR_BASE" "$HEAD")
          elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            BASE=$BEFORE
          else
            MESSAGE=$(mktemp)
            trap 'rm -f "$MESSAGE"' EXIT
            for COMMIT in $(git rev-list --reverse --topo-order "$HEAD"); do
              git show -s --format=%B "$COMMIT" > "$MESSAGE"
              python .ci-standards/.development-standards/standards.py validate-message "$MESSAGE"
            done
            BASE=$HEAD
          fi
          python .ci-standards/.development-standards/standards.py check --base "$BASE" --head "$HEAD"
  package:
    name: ${{ matrix.os }} / ${{ matrix.python }} / ${{ matrix.contract }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
        include:
          - os: ubuntu-latest
            contract: offline; scalar acceptance or refusal
          - os: macos-latest
            contract: offline; scalar acceptance or refusal
          - os: windows-latest
            contract: portable and backend refusal
          - os: ubuntu-22.04
            python: '3.12.3'
            contract: finite profile, no live SQL
            profile: cpython-3.12.3-linux-64-recovery-v1
          - os: ubuntu-22.04
            python: '3.13.5'
            contract: finite profile, no live SQL
            profile: cpython-3.13.5-linux-x86_64-gil-release-recovery-v1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: maxxab/modkit-events
          ref: 9362f0d318c762283f70b18c4f2907f1fda39f8b
          path: .ci-events
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt "psycopg[binary]==3.3.8" hatchling==1.33.0
      - run: python scripts/check_source.py --events-root .ci-events --check-dependency-only
      - run: python -m build --wheel .ci-events --outdir dependency-dist
      - name: Install pinned Events wheel
        shell: bash
        run: python -m pip install --no-index dependency-dist/*.whl
      - run: python scripts/check_source.py --events-root .ci-events
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - name: Check explicit consumer types
        env:
          MYPYPATH: src
        run: python -m mypy tests/typecheck_job_bindings.py tests/typecheck_native_ports.py --follow-imports=silent --warn-unused-ignores
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/check_sdist_contents.py
      - name: Installed pair and explicit platform contract
        shell: bash
        env:
          EXPECTED_PROFILE: ${{ matrix.profile }}
        run: python scripts/check_wheel.py dist/*.whl dependency-dist/*.whl --events-root .ci-events --expect-profile "$EXPECTED_PROFILE"

  postgres-composition:
    name: Fresh PostgreSQL 17 Workers composition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # Official 17.11-bookworm image, immutable multi-platform manifest.
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: modkit_ci_bootstrap
          POSTGRES_DB: modkit_workers_ci
          # Public disposable fixture value, never a real account credential.
          POSTGRES_PASSWORD: modkit-ci-public-fixture-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale=C
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U modkit_ci_bootstrap -d modkit_workers_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MODKIT_POSTGRES_TEST: workers-composition-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.5'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: maxxab/modkit-events
          ref: 9362f0d318c762283f70b18c4f2907f1fda39f8b
          path: .ci-events
          persist-credentials: false
      - name: Build and audit the exact installed pair
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check_source.py --events-root .ci-events --check-dependency-only
          python -m build --wheel .ci-events --outdir dependency-dist
          python -m build --wheel
          python - <<'PY_AUDIT'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from check_wheel import audit_wheel
          own = list(Path("dist").glob("*.whl"))
          events = list(Path("dependency-dist").glob("*.whl"))
          assert len(own) == len(events) == 1
          audit_wheel(Path.cwd(), own[0], "0.1.0")
          audit_wheel(Path(".ci-events"), events[0], "0.2.0", "modkit_events")
          PY_AUDIT
      - name: Check a fresh outside-checkout installed package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/workers-postgres-ci"
          mkdir "$STAGE"
          python -m venv "$STAGE/venv"
          "$STAGE/venv/bin/python" -m pip install --no-deps --no-index dist/*.whl dependency-dist/*.whl
          "$STAGE/venv/bin/python" -m pip install 'psycopg[binary]==3.3.8'
          cp scripts/check_postgres.py "$STAGE/check_postgres.py"
          cp scripts/ci_dependency.json "$STAGE/ci_dependency.json"
          cd "$STAGE"
          "$STAGE/venv/bin/python" -I -B check_postgres.py
